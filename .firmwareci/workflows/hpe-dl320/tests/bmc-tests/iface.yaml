name: BMC IFACE Test
description: Runs the IFACE test suite on the BMC to verify compliance.

stages:
  - name: BMC IFACE Suite
    steps:
      - cmd: bmctest
        name: Run IFACE Test Suite
        options:
          timeout: 30m
        parameters:
          command: suite
          config_path: "[[storage.bmc_config_dl320]]/dl320.yaml"
          suite_name: iface
