name: BMC IPMI Test
description: Runs the IPMI test suite on the BMC to verify compliance.

stages:
  - name: BMC IPMI Suite
    steps:
      - cmd: bmctest
        name: Run IPMI Test Suite
        options:
          timeout: 30m
        parameters:
          command: suite
          config_path: "[[storage.bmc_config_dl320]]/dl320.yaml"
          suite_name: ipmi
